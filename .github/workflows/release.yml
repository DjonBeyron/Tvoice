# Релиз по тегу: собрать программу, упаковать установщик и приложить его к релизу.
#
# Именно этот workflow делает работоспособными бейдж версии и ссылку «скачать» в README:
# они смотрят на последний релиз репозитория.
#
#   git tag v1.21.1 && git push origin v1.21.1
name: Release

on:
  push:
    tags: ["v*"]
  # Ручной запуск — чтобы можно было пересобрать установщик, не двигая теги.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: mingw-w64
        run: choco install mingw --no-progress -y

      # Канал закреплён в rust-toolchain.toml — rustup выберет его сам.
      - name: Тулчейн Rust (GNU)
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - uses: Swatinem/rust-cache@v2

      # Тег и версия в Cargo.toml должны совпадать: иначе релиз v1.2.3 раздавал бы
      # установщик с другим номером внутри, и понять, что у тебя стоит, стало бы нельзя.
      - name: Сверить версию с тегом
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          "Cargo.toml: $cargo, тег: $tag"
          if ($cargo -ne $tag) { throw "версия в Cargo.toml ($cargo) не совпадает с тегом ($tag)" }

      # На образах windows-latest Inno Setup обычно предустановлен; ставим только если нет.
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Собрать установщик
        shell: pwsh
        run: .\scripts\build-installer.ps1

      - name: Контрольные суммы
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File -Append -Encoding utf8 dist\SHA256SUMS.txt
          }
          Get-Content dist\SHA256SUMS.txt

      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: tvoice-installer
          path: dist/*

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Установка

            Скачайте `TVOICE-${{ github.ref_name }}-setup.exe` ниже и запустите.
            Права администратора не нужны — программа ставится в профиль пользователя.

            При первом запуске откройте **Настройки → Модели** и скачайте движок
            распознавания и модель: в установщик они не входят (весят сотни мегабайт).

            ---

            ## Installation

            Download `TVOICE-${{ github.ref_name }}-setup.exe` below and run it.
            No administrator rights required — it installs into your user profile.

            On first run open **Settings → Models** and download the recognition engine
            and a model: they are not bundled (hundreds of megabytes).
